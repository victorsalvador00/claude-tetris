<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <!-- Records: solo visible en game over -->
        <div id="gameover-records" class="records hidden">
          <p id="new-record-msg" class="new-record hidden">¡NUEVO RÉCORD!</p>
          <form id="name-form" class="name-form hidden">
            <label for="name-input">Tu nombre</label>
            <input id="name-input" type="text" maxlength="12" autocomplete="off" spellcheck="false" placeholder="Anónimo" />
            <button type="submit" id="save-name-btn">Guardar</button>
          </form>
          <div id="gameover-table-wrap">
            <table class="records-table">
              <thead>
                <tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th><th>Combo</th></tr>
              </thead>
              <tbody id="gameover-records-body"></tbody>
            </table>
          </div>
          <p class="records-stats">
            Mejor combo: <span id="gameover-best-combo">0</span> · Líneas máx.: <span id="gameover-max-lines">0</span>
          </p>
          <button id="gameover-menu-btn" class="secondary-btn">Inicio</button>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <!-- Pantalla de inicio con la tabla de records -->
    <div id="start-screen" class="start-screen">
      <div class="start-box">
        <h1 class="start-title">TETRIS</h1>
        <span class="label">MEJORES PUNTUACIONES</span>
        <table class="records-table">
          <thead>
            <tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th><th>Combo</th></tr>
          </thead>
          <tbody id="start-records-body"></tbody>
        </table>
        <p class="records-stats">
          Mejor combo: <span id="start-best-combo">0</span> · Líneas máx.: <span id="start-max-lines">0</span>
        </p>
        <button id="play-btn" class="primary-btn">Jugar</button>
        <button id="clear-records-btn" class="secondary-btn">Borrar records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
